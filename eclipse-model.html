/* ---------- procedural surface grain ---------- */
function noiseTex(size,layers,rep){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  x.fillStyle='#808080';x.fillRect(0,0,size,size);
  layers.forEach(l=>{const res=l[0],s=document.createElement('canvas');s.width=s.height=res;const sx=s.getContext('2d'),id=sx.createImageData(res,res);
    for(let i=0;i<res*res;i++){const v=(Math.random()*255)|0;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255;}
    sx.putImageData(id,0,0);x.globalAlpha=l[1];x.imageSmoothingEnabled=true;x.drawImage(s,0,0,size,size);});
  x.globalAlpha=1;
  const tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.anisotropy=4;if(rep)tx.repeat.set(rep,rep);return tx;
}

const tp2=mesh(new THREE.CylinderGeometry(0.1,0.1,3.4,10),M.wood);tp2.rotation.x=Math.PI/2;tp2.position.set(LINE_B.x,H+0.12,LINE_B.z);scene.add(tp2);

/* ---------- pull cord and bead ---------- */
const cordM=std('#D8D2C2',{roughness:0.8});
const cordIn=mesh(new THREE.CylinderGeometry(0.03,0.03,1,6),cordM,false);scene.add(cordIn);
const cordOut=mesh(new THREE.CylinderGeometry(0.035,0.035,1,6),cordM,false);scene.add(cordOut);
const bead=new THREE.Mesh(new THREE.SphereGeometry(0.6,32,24),new THREE.MeshPhysicalMaterial({color:new THREE.Color('#C8281E').convertSRGBToLinear(),roughness:0.32,clearcoat:1,clearcoatRoughness:0.08,envMapIntensity:1.2}));
bead.castShadow=true;scene.add(bead);
const hit=new THREE.Mesh(new THREE.SphereGeometry(1.7,10,8),new THREE.MeshBasicMaterial({visible:false}));scene.add(hit);
const ringM=new THREE.MeshBasicMaterial({color:0xFFE2C4,transparent:true,opacity:0,depthWrite:false,toneMapped:false,side:THREE.DoubleSide});
const ring=new THREE.Mesh(new THREE.RingGeometry(0.92,1,64),ringM);ring.renderOrder=9;scene.add(ring);
const L_TOTAL=linePt(S_COAT+0.75).distanceTo(CORD_IN)+t+1.3;
function outAt(e){const s=S_COAT+(S_SUN-S_COAT)*e;return Math.max(0.8,L_TOTAL-linePt(s+0.75).distanceTo(CORD_IN)-t);}
const OUTS=[];for(let i=0;i<=120;i++)OUTS.push(outAt(i/120));
function eFromOut(o){if(o<=OUTS[0])return 0;if(o>=OUTS[120])return 1;let i=0;while(OUTS[i+1]<o)i++;return (i+(o-OUTS[i])/(OUTS[i+1]-OUTS[i]))/120;}

/* ---------- camera ---------- */
const VIEW=()=>({theta:0.3,phi:1.37,r:94,target:new THREE.Vector3(0,19,5)});
const orbit={theta:-1.2,phi:1.0,r:150,target:new THREE.Vector3(0,19,5)};
let goal=null;
function homeGoal(){const g=VIEW(),a=cam.aspect||1.7;if(a<1.45)g.r*=Math.min(2.2,1.6/a);return g;}
function setHome(instant){const g=homeGoal();if(instant||reduce){orbit.theta=g.theta;orbit.phi=g.phi;orbit.r=g.r;orbit.target.copy(g.target);goal=null;}else goal=g;}
function resize(){const w=stageEl.clientWidth,h=stageEl.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stageEl);resize();
function axes(){cam.updateMatrixWorld();return [new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0),new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1)];}
function unitsPerPx(){return 2*orbit.r*Math.tan(THREE.MathUtils.degToRad(cam.fov/2))/Math.max(stageEl.clientHeight,1);}
function pan(dx,dy){const k=unitsPerPx(),ax=axes(),T=orbit.target;T.addScaledVector(ax[0],-dx*k).addScaledVector(ax[1],dy*k);T.set(clamp(T.x,-34,34),clamp(T.y,-4,44),clamp(T.z,-16,26));}
function zoomTo(nr,cx,cy){const r0=orbit.r;nr=clamp(nr,10,260);
  if(cx!==undefined){const b=cv.getBoundingClientRect(),px=cx-b.left-b.width/2,py=cy-b.top-b.height/2;pan(-px*(1-nr/r0),-py*(1-nr/r0));}
  orbit.r=nr;}

/* ---------- pull state ---------- */
const S={mode:'rest',p:0,v:0,tUp:0,hold:0,idle:0,touched:false,auto:!reduce,dragE:0};
const G=1.5;                                           // release: how fast the square slides back down
function release(){S.mode='free';S.v=0;S.idle=0;}

/* ---------- pointer input ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(),hv=new THREE.Vector3();
function setNdc(e){const b=cv.getBoundingClientRect();ndc.set(((e.clientX-b.left)/b.width)*2-1,-((e.clientY-b.top)/b.height)*2+1);ray.setFromCamera(ndc,cam);}
function overBead(e){setNdc(e);return ray.intersectObject(hit,false).length>0;}
function planeHitY(e){setNdc(e);cam.updateMatrixWorld();const n=new THREE.Vector3(cam.position.x-bead.position.x,0,cam.position.z-bead.position.z);if(n.lengthSq()<1e-4)n.set(0,0,1);n.normalize();plane.setFromNormalAndCoplanarPoint(n,bead.position);return ray.ray.intersectPlane(plane,hv)?hv.y:null;}
const pts=new Map();let d=null,pinch=null,bd=null,hover=false;
const mid=()=>{const a=[...pts.values()];return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  S.idle=0;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    if(e.button!==2&&!e.shiftKey&&overBead(e)){const y0=planeHitY(e);if(y0!==null){bd={id:e.pointerId,y0:y0,o0:outAt(clamp(S.p,0,1)),x:e.clientX,y:e.clientY,t:performance.now(),moved:false};S.touched=true;S.mode='drag';S.dragE=S.p;cv.setPointerCapture(e.pointerId);cv.classList.add('grabbing');return;}}
    d={x:e.clientX,y:e.clientY,t:orbit.theta,p:orbit.phi,id:e.pointerId,pan:(e.button===2||e.shiftKey),lx:e.clientX,ly:e.clientY};goal=null;cv.setPointerCapture(e.pointerId);cv.classList.add('grabbing');
  }else if(pts.size===2){d=null;bd&&endBead(false);const m=mid();pinch={dist:Math.max(m.dist,1),x:m.x,y:m.y,r:orbit.r};goal=null;}
});
function endBead(click){if(!bd)return;bd=null;cv.classList.remove('grabbing');if(S.mode==='drag')release();}
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const o=overBead(e);if(o!==hover){hover=o;cv.classList.toggle('over',o);}}return;}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(bd&&e.pointerId===bd.id){if(Math.hypot(e.clientX-bd.x,e.clientY-bd.y)>4)bd.moved=true;const y=planeHitY(e);if(y!==null){S.dragE=eFromOut(bd.o0+(y-bd.y0));}return;}
  if(pinch&&pts.size===2){const m=mid();zoomTo(pinch.r*pinch.dist/Math.max(m.dist,1),m.x,m.y);pan(m.x-pinch.x,m.y-pinch.y);pinch.x=m.x;pinch.y=m.y;return;}
  if(!d||e.pointerId!==d.id)return;
  if(d.pan){pan(e.clientX-d.lx,e.clientY-d.ly);d.lx=e.clientX;d.ly=e.clientY;}
  else{orbit.theta=clamp(d.t-(e.clientX-d.x)*0.006,-2.7,2.7);orbit.phi=clamp(d.p-(e.clientY-d.y)*0.005,0.25,1.62);}
});
function up(e){
  if(bd&&e.pointerId===bd.id){const click=!bd.moved&&performance.now()-bd.t<450;if(click){bd=null;cv.classList.remove('grabbing');S.mode='up';S.tUp=0;S.base=S.p;S.touched=true;}else endBead();}
  pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){d=null;cv.classList.remove('grabbing');}
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();goal=null;S.idle=0;const k=e.deltaMode===1?16:1;zoomTo(orbit.r*Math.exp(clamp(e.deltaY*k,-100,100)*0.0014),e.clientX,e.clientY);},{passive:false});
cv.addEventListener('dblclick',e=>{if(!overBead(e))setHome(false);});
cv.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft')orbit.theta=clamp(orbit.theta-0.08,-2.7,2.7);else if(k==='ArrowRight')orbit.theta=clamp(orbit.theta+0.08,-2.7,2.7);else if(k==='ArrowUp')orbit.phi=clamp(orbit.phi-0.06,0.25,1.62);else if(k==='ArrowDown')orbit.phi=clamp(orbit.phi+0.06,0.25,1.62);else if(k==='+'||k==='=')zoomTo(orbit.r*0.9);else if(k==='-')zoomTo(orbit.r/0.9);else if(k===' '||k==='Enter'){if(S.mode==='rest'||S.mode==='free'){S.mode='up';S.tUp=0;S.base=S.p;}else if(S.mode==='hold'||S.mode==='up')release();}else return;e.preventDefault();goal=null;});

/* ---------- per-frame ---------- */
const clock=new THREE.Clock();let introDone=false,frames=0,ringT=0,follow=0;
function step(dt){
  S.idle+=dt;
  if(S.mode==='up'){S.tUp+=dt;const f=clamp(S.tUp/3.2,0,1);S.p=S.base+(1-S.base)*ease(f);if(f>=1){S.mode='hold';S.hold=1.5;}}
  else if(S.mode==='hold'){S.hold-=dt;if(S.hold<=0)release();}
  else if(S.mode==='free'){S.v+=G*dt;S.v*=1-0.25*dt;S.p-=S.v*dt;if(S.p<=0){S.p=0;S.v=0;S.mode='rest';S.idle=0;}}
  else if(S.mode==='drag'){S.p+=(S.dragE-S.p)*Math.min(1,dt*20);}
  else if(S.mode==='rest'){if(S.auto&&introDone&&!S.touched&&S.idle>1.2){S.mode='up';S.tUp=0;S.base=S.p;S.idle=0;}else if(S.auto&&S.touched&&S.idle>16){S.mode='up';S.tUp=0;S.base=S.p;S.idle=0;}}
}
function apply(dt,time){
  const e=clamp(S.p,0,1),s=S_COAT+(S_SUN-S_COAT)*e;
  sqG.position.copy(linePt(s));
  const end=linePt(s+0.75);stretch(cordIn,end,CORD_IN);
  const out=Math.max(0.8,L_TOTAL-end.distanceTo(CORD_IN)-t);
  const topP=CORD_TOP.clone();topP.y+=out;stretch(cordOut,CORD_TOP,topP);
  bead.position.set(CORD_TOP.x,CORD_TOP.y+out+0.55,CORD_TOP.z);hit.position.copy(bead.position);
  const act=(hover||S.mode==='drag')?1.22:1;bead.scale.lerp(TMP.set(act,act,act),Math.min(1,dt*12));
  // light: the sun stays lit; the square shades the room as it covers the hole
  const cover=smooth(0.78,0.99,e);
  sunSpot.intensity=SPOT_I*(0.55+0.45*(1-cover));
  glowA.material.opacity=0.5*(0.55+0.45*(1-cover))+0.1*cover;
  // hint ring on the bead until it has been used
  const show=!S.touched&&!reduce;ringT+=dt;const ph=(ringT%2.4)/2.4;
  ringM.opacity=show?0.5*(1-ph)*smooth(0,0.1,ph):0;const rs=0.9+ph*1.5;ring.scale.set(rs,rs,rs);ring.position.copy(bead.position);ring.quaternion.copy(cam.quaternion);
}
function camera(dt){
  if(goal){const k=Math.min(1,dt*(introDone?3.4:1.9));orbit.theta+=(goal.theta-orbit.theta)*k;orbit.phi+=(goal.phi-orbit.phi)*k;orbit.r+=(goal.r-orbit.r)*k;orbit.target.lerp(goal.target,k);
    if(Math.abs(goal.r-orbit.r)<0.05&&Math.abs(goal.theta-orbit.theta)<0.001&&Math.abs(goal.phi-orbit.phi)<0.001){goal=null;introDone=true;}}
  follow+=(clamp(S.p,0,1)-follow)*Math.min(1,dt*2.2);const fr=orbit.r*(1+0.1*follow),ty=orbit.target.y+3*follow;
  cam.position.set(orbit.target.x+fr*Math.sin(orbit.phi)*Math.sin(orbit.theta),ty+fr*Math.cos(orbit.phi),orbit.target.z+fr*Math.sin(orbit.phi)*Math.cos(orbit.theta));cam.lookAt(orbit.target.x,ty,orbit.target.z);
}
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  step(dt);camera(dt);apply(dt,clock.elapsedTime);R.render(scene,cam);
  frames++;if(frames===3){const go=()=>cv.classList.add('ready');if(costumeReady)go();else{let n=0;const w=setInterval(()=>{if(costumeReady||++n>40){clearInterval(w);go();}},100);}}
  requestAnimationFrame(loop);
}
setHome(true);
if(!reduce){const g=homeGoal();orbit.theta=g.theta+0.75;orbit.phi=g.phi-0.2;orbit.r=g.r*1.35;goal=g;}else introDone=true;
loop();
if(!goal)introDone=true;

})();
</script>
